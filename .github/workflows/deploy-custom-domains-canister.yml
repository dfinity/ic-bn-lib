name: Deploy Custom Domains canister

run-name: Deploy Custom Domains canister to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        default: dev
        options:
          - dev
          - prod

env:
  CARGO_TERM_COLOR: never
  CARGO_NET_RETRY: 10 # retries fetching Rust crates on network failures
  DFX_IDENTITY_NAME: deployer
  DFX_WARNING: -mainnet_plaintext_identity
  WASM: target/wasm32-unknown-unknown/release/ic_custom_domains_canister.wasm

concurrency:
  group: deploy-custom-domains-canister-${{ inputs.environment }}
  cancel-in-progress: false # never interrupt an in-flight canister install

jobs:
  deploy:
    # Only deploy reviewed code from main. Each controller identity must be the environment secret
    # CUSTOM_DOMAINS_CANISTER_IDENTITY of its environment, with no repository or organization secret
    # of that name, and the environments must require reviewer approval and restrict deployment
    # branches to main, so a modified copy of this workflow cannot obtain them. Likewise, each
    # environment sets its own CUSTOM_DOMAINS_CANISTER_ID and CUSTOM_DOMAINS_AUTHORIZED_PRINCIPAL
    # variables, with no repository or organization variables of those names.
    if: github.ref == 'refs/heads/main'
    environment: custom-domains-canister-${{ inputs.environment }}

    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Resolve environment configuration
        id: config
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          # Environment variables: each environment holds its own values
          CANISTER_ID: ${{ vars.CUSTOM_DOMAINS_CANISTER_ID }}
          AUTHORIZED_PRINCIPAL: ${{ vars.CUSTOM_DOMAINS_AUTHORIZED_PRINCIPAL }}
        run: |
          set -eEuo pipefail

          case "${ENVIRONMENT}" in
            dev | prod) ;;
            *) echo "Unknown environment '${ENVIRONMENT}'"; exit 1 ;;
          esac

          principal_re='^[a-z2-7]+(-[a-z2-7]+)+$'

          check_principal() {
            if [ -z "$2" ]; then
              echo "Variable $1 is unset or empty"
              exit 1
            fi
            if ! printf '%s' "$2" | grep -Eq "${principal_re}"; then
              echo "$1='$2' is not a textual principal"
              exit 1
            fi
          }

          check_principal CUSTOM_DOMAINS_CANISTER_ID "${CANISTER_ID:-}"
          check_principal CUSTOM_DOMAINS_AUTHORIZED_PRINCIPAL "${AUTHORIZED_PRINCIPAL:-}"

          # post_upgrade() calls init(), which overwrites AUTHORIZED_PRINCIPAL. If it ends up None,
          # every caller becomes authorized.
          init_arg="(record { authorized_principal = opt principal \"${AUTHORIZED_PRINCIPAL}\" })"

          echo "environment:  ${ENVIRONMENT}"
          echo "canister id:  ${CANISTER_ID}"
          echo "init arg:     ${init_arg}"

          {
            echo "canister_id=${CANISTER_ID}"
            echo "init_arg=${init_arg}"
          } >> "${GITHUB_OUTPUT}"

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Check Candid interface
        run: cargo test --locked --package ic-custom-domains-canister --lib

      - name: Build canister
        run: cargo build --locked --release --package ic-custom-domains-canister --target wasm32-unknown-unknown

      - name: Package WASM
        run: |
          set -eEuo pipefail

          gzip -9 -n -c "${WASM}" > "${WASM}.gz"

          echo "raw: $(sha256sum "${WASM}")"
          echo "gz:  $(sha256sum "${WASM}.gz")"

      - uses: dfinity/setup-dfx@e50c04f104ee4285ec010f10609483cf41e4d365 # main, the repo has no tags
        with:
          dfx-version: "0.32.0"

      - name: Import controller identity
        env:
          # Environment secret: each environment holds only its own controller identity
          IDENTITY: ${{ secrets.CUSTOM_DOMAINS_CANISTER_IDENTITY }}
        run: |
          set -eEuo pipefail
          umask 077

          pem="${IDENTITY:-}"
          if [ -z "${pem}" ]; then
            echo "Environment secret CUSTOM_DOMAINS_CANISTER_IDENTITY is unset or empty"
            exit 1
          fi

          printf '%s\n' "${pem}" > "${RUNNER_TEMP}/controller.pem"
          if ! head -n1 "${RUNNER_TEMP}/controller.pem" | grep -q -- '-----BEGIN'; then
            echo "Secret is not a PEM"
            exit 1
          fi

          dfx identity import --storage-mode plaintext "${DFX_IDENTITY_NAME}" "${RUNNER_TEMP}/controller.pem"
          rm -f "${RUNNER_TEMP}/controller.pem"

          echo "Deploying as $(dfx identity get-principal --identity "${DFX_IDENTITY_NAME}")"

      - name: Upgrade canister
        env:
          CANISTER_ID: ${{ steps.config.outputs.canister_id }}
          INIT_ARG: ${{ steps.config.outputs.init_arg }}
        run: |
          set -eEuo pipefail

          # Take a snapshot of the current canister state before upgrading
          dfx canister stop "${CANISTER_ID}" --identity "${DFX_IDENTITY_NAME}" --network ic
          dfx canister snapshot create "${CANISTER_ID}" --identity "${DFX_IDENTITY_NAME}" --network ic
          dfx canister start "${CANISTER_ID}" --identity "${DFX_IDENTITY_NAME}" --network ic

          # --upgrade-unchanged: without it dfx skips an identical WASM, so post_upgrade() would not
          # run and a changed authorized principal would not be applied.
          dfx canister install "${CANISTER_ID}" \
            --wasm "${WASM}.gz" \
            --mode upgrade \
            --argument "${INIT_ARG}" \
            --upgrade-unchanged \
            --identity "${DFX_IDENTITY_NAME}" \
            --network ic \
            --yes </dev/null

      - name: Query canister status
        id: status
        if: always()
        env:
          CANISTER_ID: ${{ steps.config.outputs.canister_id }}
        run: |
          set -uo pipefail

          if [ -z "${CANISTER_ID:-}" ]; then
            echo "No canister id was resolved, skipping status"
            exit 0
          fi

          if ! status=$(dfx canister status "${CANISTER_ID}" --identity "${DFX_IDENTITY_NAME}" --network ic 2>&1 </dev/null); then
            echo "Could not query canister status"
            exit 1
          fi

          echo "${status}"

          escaped=$(printf '%s' "${status}" |
            sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' |
            awk '{ printf "%s\\n", $0 }')

          nl='\n'
          fence='```'
          printf 'slack_text=%s%s%s%s%s\n' "${nl}" "${fence}" "${nl}" "${escaped}" "${fence}" >> "${GITHUB_OUTPUT}"

      - name: Remove controller identity
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/controller.pem"
          rm -rf "${HOME}/.config/dfx/identity/${DFX_IDENTITY_NAME}"

      - name: Send Slack message
        if: always()
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Custom-domains canister deploy to `${{ inputs.environment }}` finished with status `${{ job.status }}`: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>${{ steps.status.outputs.slack_text }}"
