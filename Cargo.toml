[workspace]
resolver = "3"
members = ["ic-bn-lib", "custom-domains/canister", "custom-domains/api"]
default-members = ["ic-bn-lib", "custom-domains/canister", "custom-domains/api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
homepage = "https://github.com/dfinity/ic-bn-lib"
repository = "https://github.com/dfinity/ic-bn-lib"
readme = "README.md"
keywords = ["internet-computer", "icp", "dfinity", "boundary-nodes"]
categories = []

[workspace.dependencies]
ahash = "0.8.11"
anyhow = "1.0.93"
arc-swap = "1.7.1"
arrayvec = "0.7"
async-channel = "2.3.1"
async-trait = "0.1.83"
axum = "0.8.1"
axum-extra = { version = "0.12.6", features = ["middleware"] }
axum-server = "0.8.0"
base64 = "0.22.1"
bytes = "1.10.0"
candid = "0.10.10"
candid_parser = "0.4"
# 0.11 breaks ZeroizeOnDrop it seems
chacha20poly1305 = "0.10"
chrono = "0.4"
clap = { version = "4.5.20", features = ["derive", "string", "env"] }
criterion = { version = "0.6", features = ["html_reports"] }
derive-new = "0.7.0"
flate2 = { version = "1.0" }
fqdn = { version = "0.5.2", features = ["punycode"] }
futures = "0.3.31"
futures-util = "0.3.31"
governor = "0.10.0" # must match tower-governor deps
hex = { version = "0.4.3" }
hickory-proto = "0.26.1"
hickory-resolver = { version = "0.26.1", default-features = false, features = [
    "tokio",
    "tls-aws-lc-rs",
    "https-aws-lc-rs",
    "dnssec-aws-lc-rs",
    "webpki-roots",
] }
http = "1.3.1"
http-body = "1.0.1"
http-body-util = "0.1.2"
humantime = "2.2.0"
hyper = "1.7.0"
hyper-rustls = { version = "0.27.5", default-features = false, features = [
    "http1",
    "http2",
    "tls12",
    "native-tokio",
    "aws-lc-rs",
    "logging",
    "webpki-roots",
] }
hyper-util = { version = "0.1.10", features = ["full"] }
indoc = "2.0.6"
ic-agent = { version = "0.49" }
ic-cdk = "0.20"
ic-cdk-timers = "1.0"
ic-custom-domains-canister-api = { version = "0.2", path = "./custom-domains/api" }
ic-http-types = "0.1.0"
ic-stable-structures = "0.7.0"
ic-verify-bls-signature = "0.6"
ipnet = { version = "2", features = ["serde"] }
instant-acme = { version = "0.8.5", default-features = false, features = [
    "aws-lc-rs",
    "hyper-rustls",
] }
itertools = "0.15.0"
mail-auth = "0.11.0"
mail-parser = { version = "0.11.3", features = ["full_encoding"] }
mail-send = { version = "0.6.0", default-features = false, features = [
    "builder",
] }
maxminddb = "0.29"
mockall = "0.13.0"
mock-io = { version = "0.3.2", features = ["full"] }
moka = { version = "0.12.15", features = ["sync"] }
nix = { version = "0.31.0", features = ["signal"] }
ppp = "2.3.0"
parse-size = { version = "1.1.0", features = ["std"] }
pem = "3.0.5"
pocket-ic = "=12.0.0"
prometheus = "0.14.0"
prost = { version = "0.14.1" }
prost-types = { version = "0.14.1" }
rand = { version = "0.8.5", features = ["small_rng"] }
# Do not upgrade unless you want to upgrade `rand` too
rand_regex = "=0.17.0"
regex = "1.11.2"
reqwest = { version = "0.13.2", default-features = false, features = [
    "blocking",
    "http2",
    "rustls",
    "hickory-dns",
    "json",
    "stream",
    "gzip",
    "query",
] }
rcgen = { version = "0.14.3", default-features = false, features = [
    "crypto",
    "pem",
    "aws_lc_rs",
] }
rustls = { version = "0.23.18", default-features = false, features = [
    "aws_lc_rs",
    "std",
    "brotli",
] }
rustls-acme = { version = "0.15.1", default-features = false, features = [
    "webpki-roots",
    "tls12",
    "aws-lc-rs",
] }
rustls-pemfile = "2.2.0"
rustls-platform-verifier = "0.7.0"
scopeguard = "1.2.0"
serde = { version = "1.0.214", features = ["derive"] }
serde_cbor = "0.11.2"
serde_json = "1.0.132"
serde_with = "3.14.0"
serde_yaml_ng = "0.10"
# Sev 8.0+ requires uuid 1.18+
sev = { version = "7.1.0", default-features = false, features = [
    "snp",
    "crypto_nossl",
] }
sha1 = "0.11.0"
sha2 = { version = "0.11.0" }
show-option = "0.2"
smtp-proto = "0.2.1"
socket2 = "0.6.0"
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
systemstat = "0.2.3"
tar = { version = "0.4.44" }
tempfile = "3.23"
thiserror = "2.0.3"
tracing-subscriber = "0.3"
tokio = { version = "1.47.0", features = ["full"] }
tokio-rustls = { version = "0.26.0", default-features = false, features = [
    "tls12",
    "logging",
    "aws-lc-rs",
] }
tokio-io-timeout = "1.2.0"
tokio-test = "0.4"
tokio-util = { version = "0.7.12", features = ["full"] }
tower = { version = "0.5.1", features = ["util"] }
tower_governor = { version = "0.8" }
tower-service = "0.3.3"
tower-http = { version = "0.7", features = ["trace"] }
tracing = { version = "0.1.40", features = ["attributes"] }
url = "2.5.3"
utoipa = { version = "5.4.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
# DO NOT upgrade, this breaks monorepo compatibility
# Read https://github.com/uuid-rs/uuid/releases/tag/1.13.0
uuid = { version = "=1.12.1", features = ["v7", "serde"] }
vrl = { version = "0.34.0", default-features = false, features = ["value"] }
webpki-root-certs = "1.0.1"
x509-parser = "0.18.1"
zeroize = { version = "1.8.1", features = ["derive"] }
zstd = "0.13.2"
